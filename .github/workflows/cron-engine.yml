name: SNS Cron Engine

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm install

      - name: Run cron engine
        env:
          SNS_DB_HOST: "aws-0-ap-northeast-1.pooler.supabase.com"
          SNS_DB_PORT: "5432"
          SNS_DB_USER: "sns_engine.dvysbebkzvvqyqtlgqcx"
          SNS_DB_NAME: "postgres"
          SNS_DB_SCHEMA: "sns"
          SNS_ENGINE_DB_PASSWORD: ${{ secrets.SNS_ENGINE_DB_PASSWORD }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # 2026-09-22 ばる承認により本番有効化。ただしworkflow_dispatch(手動実行)は
          # 従来どおりdry-run固定(cron-engine.jsの--liveフラグが立たないため、
          # THREADS_LIVE_ENABLEDの値に関わらずThreadsへの実登録には到達しない)。
          THREADS_LIVE_ENABLED: "true"
        run: |
          # イベント種別で完全に分離する。手動実行からliveへ進む経路は一切存在しない
          # (workflow_dispatchにinputすら定義していないため、何を指定してもliveにはならない)。
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "scheduleトリガー: live実行"
            node cron-engine.js --live
          else
            echo "workflow_dispatch(手動実行): dry-run固定(live経路なし)"
            node cron-engine.js
          fi
