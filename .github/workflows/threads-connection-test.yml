name: Threads API Connection Test

on:
  workflow_dispatch:
    inputs:
      publish_test:
        description: "trueにすると実際にThreadsへテキスト投稿を1件作成・公開するテストまで行う(falseなら接続確認のみ)"
        required: false
        default: "false"
      media_type:
        description: "画像/動画投稿テストを行う場合に指定(image / video / 空欄なら実行しない)"
        required: false
        default: ""
      media_url:
        description: "media_type指定時の公開メディアURL"
        required: false
        default: ""

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run Threads connection test
        if: ${{ github.event.inputs.media_type == '' }}
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.publish_test }}" = "true" ]; then
            node test-threads-connection.js --publish-test
          else
            node test-threads-connection.js
          fi

      - name: Run Threads media test
        if: ${{ github.event.inputs.media_type != '' }}
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          node test-threads-media.js --type="${{ github.event.inputs.media_type }}" --url="${{ github.event.inputs.media_url }}"
