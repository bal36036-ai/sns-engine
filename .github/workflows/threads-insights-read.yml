name: Threads Insights Read (manual, GET-only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  read-insights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test with mocked API only
        run: node --test test-threads-insights.js
      - name: Read lifetime insights (GET only)
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: node fetch-threads-insights.js
